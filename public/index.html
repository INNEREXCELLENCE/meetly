<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meetly</title><style>
:root{--bg:#f6f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#5b5ce2;--blue:#e4efff;--red:#f09fa2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:28px 20px 60px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:32px}.logo{font-weight:900;font-size:25px}.pill{border:1px solid var(--line);background:white;border-radius:999px;padding:8px 14px;color:var(--muted)}.hero{padding:34px 0 24px}.hero h1{font-size:42px;line-height:1.15;margin:0 0 12px;letter-spacing:-1.5px}.hero p{color:var(--muted);font-size:17px}.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 8px 30px #1720330b;margin-top:18px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tab{flex:1;border:1px solid var(--line);background:#fafbfc;border-radius:12px;padding:13px;font-weight:700}.tab.on{background:#171b2e;color:#fff;border-color:#171b2e}.form{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700;display:block;margin-bottom:7px}input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;outline:none}input:focus{border-color:var(--accent)}.primary{border:0;background:var(--accent);color:#fff;border-radius:12px;padding:14px 18px;font-weight:800}.workspace{display:none}.workspace.show{display:block}.wshead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.wshead h2{margin:0 0 5px}.actions{display:flex;gap:8px;flex-wrap:wrap}.secondary{border:1px solid var(--line);background:white;border-radius:11px;padding:11px 14px;font-weight:700}.notice{padding:14px;border-radius:14px;background:#f0f1ff;margin:18px 0;color:#3637a4}.gridwrap{overflow:auto;max-height:calc(100vh - 300px);border:1px solid var(--line);border-radius:12px}.grid{display:grid;grid-template-columns:72px repeat(1,minmax(78px,1fr));min-width:max-content}.grid > *{min-width:78px}.ghead,.time{padding:7px 5px;border-bottom:1px solid var(--line);font-size:11px}.ghead{text-align:center;font-weight:800}.time{font-weight:700}.slot{min-height:38px;border:1px solid #fff;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:3px;border-radius:6px;margin:1px;padding:2px;transition:.15s}.slot:hover{transform:translateY(-1px)}.slot.mine{box-shadow:inset 0 0 0 3px #20243b}.slot.focus{outline:3px solid #111;outline-offset:-3px;z-index:3}.slot .count{font-weight:800;font-size:11px}.slot .pct{font-size:9px;opacity:.72}.legend{display:flex;gap:12px;align-items:center;margin:15px 0;color:var(--muted);font-size:13px}.grad{height:12px;width:180px;border-radius:99px;background:linear-gradient(90deg,var(--blue),#d8cfe5,var(--red))}.people{margin-top:18px;display:grid;grid-template-columns:1fr 1fr;gap:14px}.peoplebox{border:1px solid var(--line);border-radius:16px;padding:16px}.peoplebox h3{font-size:14px;margin:0 0 10px}.person{display:inline-flex;margin:4px;padding:8px 10px;border-radius:999px;background:#f2f4f7;border:1px solid var(--line);font-size:13px}.person.bad{cursor:pointer}.person.bad:hover{border-color:#e2555d;color:#b4232b}.person.bad small{font-weight:500}.slot.mine{background:#c9d8ff!important}.selectedPerson{margin-top:18px;padding:16px;border-radius:16px;background:#fff7f7;border:1px solid #f3c5c8}.best{margin-top:18px;padding:18px;border-radius:16px;background:#171b2e;color:#fff;display:flex;justify-content:space-between;gap:20px;align-items:center}.small{color:var(--muted);font-size:13px}.hidden{display:none!important}.time-selects{display:flex;align-items:center;gap:6px}.time-selects select{width:auto;min-width:72px;padding:11px 10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text);outline:none}.time-selects select:focus{border-color:var(--accent)}.time-unit{font-size:13px;color:var(--muted);margin-right:4px}
@media(max-width:700px){.form,.people{grid-template-columns:1fr}.full{grid-column:auto}.hero h1{font-size:32px}.wshead{flex-direction:column}}
</style></head><body><div class="wrap"><div class="top"><div class="logo">Meetly</div></div><section id="landing"><div class="hero"><h1>모두의 시간을 한눈에.<br>가장 좋은 약속을 찾아보세요.</h1><p>링크 하나로 일정을 만들고, 참여자들의 가능 시간을 모아보세요.</p></div><div class="card"><div class="tabs"><button class="tab on" id="newTab">새 일정 만들기</button><button class="tab" id="joinTab">일정 참여하기</button></div><form id="createForm" class="form"><div class="full"><label>일정 이름</label><input id="eventName" placeholder="예: 팀 회식" required></div><div><label>시작 날짜</label><input id="startDate" type="date"></div><div><label>종료 날짜</label><input id="endDate" type="date"></div><div><label>시작 시간</label><div class="time-selects"><select id="startHour" aria-label="시작 시"></select><span class="time-unit">시</span><select id="startMinute" aria-label="시작 분"><option value="00">00</option><option value="30">30</option></select><span class="time-unit">분</span></div></div><div><label>종료 시간</label><div class="time-selects"><select id="endHour" aria-label="종료 시"></select><span class="time-unit">시</span><select id="endMinute" aria-label="종료 분"><option value="00">00</option><option value="30">30</option></select><span class="time-unit">분</span></div></div><button class="primary full">일정 만들기</button></form><form id="joinForm" class="form hidden"><div class="full"><label>일정 링크</label><input id="joinUrl" placeholder="공유받은 Meetly 링크를 붙여넣으세요" required></div><button class="primary full">일정 참여하기</button></form><div id="homeMsg" class="small"></div></div></section><section id="workspace" class="workspace"><div class="card"><div class="wshead"><div><h2 id="title"></h2><div class="small" id="eventInfo"></div></div><div class="actions"><button class="secondary" id="copyLink">링크 공유</button><button class="secondary" id="homeBtn">처음으로</button></div></div><div class="form"><div><label>내 이름</label><input id="name" placeholder="예: 민수"></div></div><div class="legend"><span>참여 인원</span><div class="grad"></div><span>적음</span><span>많음</span></div><div class="gridwrap"><div id="grid" class="grid"></div></div><div class="small" style="margin-top:10px">시간 셀을 누르면 선택/해제되며, 해당 시간의 가능·불가능한 사람과 각자의 가능한 시간이 함께 표시됩니다.</div><div id="people" class="people hidden"><div class="peoplebox"><h3>가능한 사람</h3><div id="yes"></div></div><div class="peoplebox"><h3>불가능한 사람 · 클릭하면 가능 시간에 검은 테두리 표시</h3><div id="no"></div></div></div><div id="selectedPerson" class="selectedPerson hidden"></div><div class="best"><div><div class="small" style="color:#bfc3d4">현재 가장 좋은 시간</div><b id="bestText">-</b></div><button class="secondary" id="save" style="background:white">내 시간 저장</button></div></div></section></div><script>
const $=s=>document.querySelector(s);let eventData=null,selected=new Set(),activePerson=null;const colors=['#e4efff','#dceaff','#d4e5fb','#cbdff5','#d1d8ee','#d8cfe5','#e1c2c8','#e8b5b7','#edaaac','#f09fa2'];
function heat(n,total){if(!n)return '#eef1f5';return colors[Math.max(0,Math.min(9,Math.round((n/total)*9)))];}function link(){return location.origin+'/?event='+eventData.id}function days(){return Array.isArray(eventData.days)&&eventData.days.length?eventData.days:dateRange(eventData.startDate,eventData.endDate)}
function dateRange(a,b){if(!a)return [];const out=[];const d=new Date(a+'T00:00:00');const end=new Date((b||a)+'T00:00:00');while(d<=end){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');out.push(`${y}-${m}-${day}`);d.setDate(d.getDate()+1)}return out}
function dayLabel(d){const dt=new Date(d+'T00:00:00');return `${dt.getMonth()+1}/${dt.getDate()} (${['일','월','화','수','목','금','토'][dt.getDay()]})`}function allSlots(){return Array.from({length:48},(_,i)=>{const h=String(Math.floor(i/2)).padStart(2,'0');return h+':'+(i%2?'30':'00')})}
function slots(){const all=allSlots();const start=eventData.startTime||'00:00',end=eventData.endTime||'23:30';return all.filter(t=>t>=start&&t<=end)}
function validTime(t){return /^(?:[01]\d|2[0-3]):(?:00|30)$/.test(t)}
async function load(id){const r=await fetch('/api/events/'+encodeURIComponent(id));if(!r.ok)throw Error('not found');eventData=(await r.json()).event;selected.clear();activePerson=null;$('#landing').style.display='none';$('#workspace').classList.add('show');$('#title').textContent=eventData.name;$('#eventInfo').textContent=(eventData.startDate&&eventData.endDate?eventData.startDate+' ~ '+eventData.endDate+' · ':'')+eventData.startTime+' ~ '+eventData.endTime;render()}
function count(slot){return (eventData.participants||[]).filter(p=>p.slots.includes(slot)).length}function names(slot,yes){return (eventData.participants||[]).filter(p=>p.slots.includes(slot)===yes).map(p=>p.name)}
function render(){const ds=days(),ss=slots(),total=eventData.participants.length;if(!ds.length){$('#grid').innerHTML='<div class="small" style="grid-column:1/-1;padding:30px;text-align:center">선택된 날짜가 없습니다.</div>';return}$('#grid').style.gridTemplateColumns=`100px repeat(${ds.length},minmax(120px,1fr))`;let h='<div class="ghead">시간</div>'+ds.map(d=>`<div class="ghead">${dayLabel(d)}</div>`).join('');ss.forEach((t,ri)=>{h+=`<div class="time">${t}</div>`;ds.forEach((d,di)=>{const key=d+' '+t,n=count(key),bg=heat(n,total),mine=selected.has(key)?'mine':'';h+=`<button class="slot ${mine}" data-slot="${key}" aria-pressed="${selected.has(key)}" style="background:${bg}"><span class="count">${n} / ${total}</span><span class="pct">${total?Math.round(n/total*100):0}%</span></button>`})});$('#grid').innerHTML=h;document.querySelectorAll('.slot').forEach(b=>b.onclick=()=>{
  const key=b.dataset.slot;
  selected.has(key)?selected.delete(key):selected.add(key);
  showPeople(key);
  render();
  showPeople(key);
});if(activePerson)highlightPerson(activePerson);best();}
function showPeople(key){
  $('#people').classList.remove('hidden');
  const [date,time]=key.split(' ');
  const ps=eventData.participants||[];
  const yes=ps.filter(p=>p.slots.includes(key));
  const no=ps.filter(p=>!p.slots.includes(key));
  $('#yes').innerHTML=yes.map(p=>`<span class="person">${p.name}</span>`).join('')||'<span class="small">없음</span>';
  $('#no').innerHTML=no.map(p=>{
    const times=p.slots.filter(x=>x.startsWith(date+' ')).map(x=>x.split(' ')[1]).sort();
    return `<button class="person bad" data-person="${p.name}">${p.name}</button>`;
  }).join('')||'<span class="small">없음</span>';
  document.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>highlightPerson(b.dataset.person));
  $('#selectedPerson').classList.remove('hidden');
  $('#selectedPerson').innerHTML=`<b>${dayLabel(date)} ${time}</b><div class="small" style="margin-top:8px">가능 ${yes.length}명 · 불가능 ${no.length}명</div>`;
  activePerson=null;
}
function highlightPerson(name){activePerson=name;const p=(eventData.participants||[]).find(x=>x.name===name);if(!p)return;$('#selectedPerson').classList.add('hidden');document.querySelectorAll('.slot').forEach(b=>{b.classList.toggle('focus',p.slots.includes(b.dataset.slot))})}
function best(){const all=[...new Set((eventData.participants||[]).flatMap(p=>p.slots))];if(!all.length){$('#bestText').textContent='아직 참여자가 없습니다';return}all.sort((a,b)=>count(b)-count(a));$('#bestText').textContent=all[0]+' · '+count(all[0])+'/'+eventData.participants.length+'명 가능'}
$('#newTab').onclick=()=>{$('#newTab').classList.add('on');$('#joinTab').classList.remove('on');$('#createForm').classList.remove('hidden');$('#joinForm').classList.add('hidden')};$('#joinTab').onclick=()=>{$('#joinTab').classList.add('on');$('#newTab').classList.remove('on');$('#joinForm').classList.remove('hidden');$('#createForm').classList.add('hidden')};
$('#startDate').onchange=()=>{if($('#startDate').value)$('#endDate').min=$('#startDate').value;if($('#endDate').value&&$('#endDate').value<$('#startDate').value)$('#endDate').value=$('#startDate').value};$('#endDate').onchange=()=>{if($('#startDate').value&&$('#endDate').value<$('#startDate').value)$('#endDate').value=$('#startDate').value};
function fillHourOptions(id){const el=$('#'+id);for(let h=0;h<24;h++){const v=String(h).padStart(2,'0');el.insertAdjacentHTML('beforeend',`<option value="${v}">${v}</option>`)} }function getTime(h,m){return $('#'+h).value+':'+$('#'+m).value}['startHour','endHour'].forEach(fillHourOptions);$('#startHour').value='09';$('#startMinute').value='00';$('#endHour').value='18';$('#endMinute').value='00';
$('#createForm').onsubmit=async e=>{e.preventDefault();if(!$('#startDate').value||!$('#endDate').value)return alert('시작 날짜와 종료 날짜를 선택해주세요.');const startTime=getTime('startHour','startMinute'),endTime=getTime('endHour','endMinute');if(!validTime(startTime)||!validTime(endTime))return alert('시간은 00:00 또는 00:30 형식으로 선택해주세요.');if(startTime>endTime)return alert('종료 시간은 시작 시간보다 빠를 수 없습니다.');const r=await fetch('/api/events',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#eventName').value,startDate:$('#startDate').value,endDate:$('#endDate').value,startTime,endTime,days:dateRange($('#startDate').value,$('#endDate').value),slots:[]})});const j=await r.json();if(!r.ok)return alert(j.error);history.pushState({},'', '?event='+j.event.id);await load(j.event.id);alert('일정이 만들어졌습니다. 링크를 공유하세요.')};
$('#joinForm').onsubmit=async e=>{e.preventDefault();try{const u=new URL($('#joinUrl').value.trim());const id=u.searchParams.get('event');if(!id)throw Error();history.pushState({},'',u.pathname+u.search);await load(id)}catch{alert('올바른 Meetly 일정 링크를 입력해주세요.')}};
$('#save').onclick=async()=>{const name=$('#name').value.trim();if(!name)return alert('이름을 입력해주세요.');const r=await fetch('/api/events/'+eventData.id,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,slots:[...selected]})});const j=await r.json();if(!r.ok)return alert(j.error);eventData=j.event;alert('가능 시간이 저장되었습니다.');render()};$('#copyLink').onclick=async()=>{try{await navigator.clipboard.writeText(link());alert('공유 링크를 복사했습니다.')}catch{prompt('아래 링크를 복사하세요',link())}};$('#homeBtn').onclick=()=>{history.pushState({},'',location.pathname);location.reload()};
if(new URLSearchParams(location.search).get('event'))load(new URLSearchParams(location.search).get('event')).catch(()=>alert('일정을 찾을 수 없습니다.'));setInterval(async()=>{if(eventData){try{eventData=(await (await fetch('/api/events/'+eventData.id)).json()).event;render()}catch{}}},3000);
</script><script src="/toggle-mode.js"></script>
</body></html>
